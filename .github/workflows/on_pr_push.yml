name: On push
on: [push, pull_request]

jobs:
  build_ui:
    name: Build embedded UI
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Build embedded UI
      run: |
        pushd ${GITHUB_WORKSPACE}/server
        go generate ./...
        popd

    - name: Test editor value and patch contracts
      run: node --test ui/src/globals/editor.test.mjs

    - name: Upload embedded UI artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ui-dist
        path: ui/dist

  test:
    name: Test on Ubuntu (cgo=${{ matrix.cgo }})
    needs: [build_ui]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cgo: ['1', '0']

    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Download embedded UI artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ui-dist
        path: ui/dist

    - name: Env Debug
      run: |
        go env
        pwd
        echo ${HOME}
        echo ${GITHUB_WORKSPACE}

    - name: Setup test environment
      run: |
        docker compose up -d --wait redis postgis mysql
        docker compose run --rm migration

    - name: Postgres Debug
      env:
        PGUSER: postgres
        PGHOST: localhost
        PGDATABASE: postgres
        PGPASSWORD: postgres
      run: |
        psql -c "\l"

    - name: Run tests
      env:
        CGO_ENABLED: ${{ matrix.cgo }}

        # redis tests
        RUN_REDIS_TESTS: yes

        # AWS S3 tests: only run when AWS credentials are configured as repo secrets.
        # A public S3 bucket must not be assumed; without secrets these tests skip.
        RUN_S3_TESTS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && 'yes' || '' }}
        AWS_TEST_BUCKET: ${{ secrets.AWS_TEST_BUCKET }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        # PostGIS tests (services are started via docker compose)
        RUN_POSTGIS_TESTS: yes
        PGURI: postgres://postgres:postgres@localhost:5432/tegola?sslmode=disable
        # tegola_no_access is created by testdata/postgis/migration.sh and
        # must keep its restricted grants: this URI exercises the
        # no-permission regression from go-spatial/tegola#538.
        PGURI_NO_ACCESS: postgres://tegola_no_access:postgres@localhost:5432/tegola?sslmode=disable
        PGSSLMODE: disable
        PGSSLKEY: ""
        PGSSLCERT: ""
        PGSSLROOTCERT: ""

        # MySQL tests (service is started via docker compose). The live
        # construction test in provider/mysql connects with host=localhost,
        # database=test, user=u, password=p.
        RUN_MYSQL_TESTS: yes
        MYSQL_FEATURE_TEST_DSN: u:p@tcp(localhost:3306)/test

        # Mutation regression suites use only the disposable compose databases.
        TEGOLA_REVIEW_MYSQL_DSN: u:p@tcp(localhost:3306)/test
        # Isolated follow-up fixtures create databases and restricted test users.
        TEGOLA_REVIEW_MYSQL_ADMIN_DSN: root:root@tcp(localhost:3306)/test
        TEGOLA_MOS_MYSQL_DSN: u:p@tcp(localhost:3306)/test
        TEGOLA_REVIEW_POSTGIS_DSN: postgres://postgres:postgres@localhost:5432/tegola?sslmode=disable

        # HANA tests: only run when the connection string is provided as a repo secret.
        # The credentials were hardcoded in upstream CI (go-spatial/tegola#893) and must
        # be rotated; they are never stored in this repository.
        RUN_HANA_TESTS: ${{ secrets.HANA_CONNECTION_STRING != '' && 'yes' || '' }}
        HANA_CONNECTION_STRING: ${{ secrets.HANA_CONNECTION_STRING }}
      run: |
        go test -mod vendor -covermode atomic -coverprofile=profile.cov ./...

    - name: Send coverage report to Coveralls
      if: matrix.cgo == '1'
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        go install github.com/mattn/goveralls@v0.0.5
        $(go env GOPATH)/bin/goveralls -coverprofile=profile.cov -service=github

    - name: Tear down test environment
      if: always()
      run: docker compose down

  module-modes:
    name: Module modes (mod reproducibility)
    needs: [build_ui]
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Download embedded UI artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ui-dist
        path: ui/dist

    - name: Build in module mode
      run: go build -mod=mod ./...

    - name: Test in module mode
      run: go test -mod=mod ./...

    - name: Verify vendor tree is reproducible
      run: |
        go mod vendor
        git diff --exit-code -- vendor/

    - name: Verify published fork dependencies and external consumer
      run: go run -mod=vendor ./ci/check-dependencies

    - name: Verify published Tegola without replacements
      if: github.event_name == 'push' && github.repository == 'alexeydott/tegola'
      env:
        TEGOLA_REVISION: ${{ github.sha }}
      run: go run -mod=vendor ./ci/check-dependencies -revision "$TEGOLA_REVISION"

  docker-build:
    name: Docker image build
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Build docker image
      run: docker build -t tegola-ci:${{ github.sha }} .

  lint:
    name: Lint (gofmt + golangci-lint)
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: gofmt check
      run: |
        unformatted=$(gofmt -s -l . | grep -v '^vendor/' || true)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi

    - name: golangci-lint
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Install and run go vulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        govulncheck ./...
