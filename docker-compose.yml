# this file is used to bootstrap services to run tegola tests against
services:
  redis:
    image: redis:7.4
    container_name: redis
    ports:
    - 127.0.0.1:6379:6379

  postgis:
    image: postgis/postgis:16-3.5-alpine
    container_name: postgis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
    - 127.0.0.1:5432:5432

  migration:
    image: postgis/postgis:16-3.5-alpine
    container_name: migration
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
    - ./testdata:/testdata
    command: ["/bin/bash", "-c", "testdata/postgis/migration.sh"]

  mysql:
    image: mysql:8.4
    container_name: mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: root
      # credentials match the live construction test in provider/mysql
      # (mysql_internal_test.go), which connects with database=test,
      # user=u, password=p.
      MYSQL_DATABASE: test
      MYSQL_USER: u
      MYSQL_PASSWORD: p
    ports:
    - 127.0.0.1:3306:3306

  # NOTE: useful for debugging
  # does not run by default, only when you run with:
  # docker-compose --profile pgadmin up (-d)
  # afterwards navigate to localhost:5555 in the browser
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@tegola.io"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
    - "127.0.0.1:5555:80"
    profiles:
    - pgadmin
